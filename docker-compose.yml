version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netgraph-backend
    # Grant capabilities required for raw sweeps / ping checks
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8000:8000"
    volumes:
      - backend-db:/workspace
    environment:
      - DATABASE_URL=sqlite:///./netgraph.db
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netgraph-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-db:
